services:
  libretv:
    image: bestzwei/libretv:latest
    container_name: libretv
    ports:
      - "8899:8080" # 将内部 8080 端口映射到主机的 8899 端口
    environment:
      - PASSWORD=${PASSWORD:-your_password} # 可将 your_password 修改为你想要的密码，默认为 your_password
      - DEFAULT_SOURCES='[{"name":"欧乐影视","url":"https://www.olevod.com/api.php/provide/vod"},{"name":"饭团影视","url":"https://www.fantuan.tv/api.php/provide/vod"},{"name":"影视工厂","url":"https://cj.lziapi.com/api.php/provide/vod"},{"name":"爱壹帆影视国际版","url":"https://www.yfsp.tv/api.php/provide/vod"}]'
#    volumes:
#      - libretv_data:/app # 不要修改
    restart: unless-stopped

